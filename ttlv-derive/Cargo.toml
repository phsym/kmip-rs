[package]
name = "ttlv-derive"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

[dev-dependencies]
trybuild = "1"
# Dev-dep cycle: `ttlv` depends on this crate (optional, feature = "derive").
# Pulling `ttlv` in here is legal because dev-deps don't leak into the release
# graph, and it lets compile-pass fixtures resolve the generated `::ttlv::*`
# references the macros emit.
ttlv = { path = "../ttlv", default-features = false }
