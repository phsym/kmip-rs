[package]
name = "ttlv"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
# Default features
default = []

# Optional features
bitflags = ["dep:bitflags"]
derive = ["dep:ttlv-derive"]
chrono = ["dep:chrono"]
xml = ["dep:quick-xml", "dep:data-encoding", "chrono"]
text = ["chrono", "dep:data-encoding"]
arbitrary = ["dep:arbitrary"]
serde = ["dep:serde", "dep:serde_with", "dep:cfg_eval"]
io-async = ["dep:futures-util"]

[dependencies]
ttlv-derive = { version = "*", path = "../ttlv-derive", optional = true }

task-local-extensions = "0.1"

thiserror = "2"
strum = "0.28"
strum_macros = "0.28"
chrono = { version = "0.4", optional = true }
bitflags = { version = "2", optional = true }

arbitrary = { version = "1", features = ["derive"], optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_with = { version = "3", optional = true, features = ["base64"] }
cfg_eval = { version = "0.1", optional = true }

quick-xml = { version = "0.41", optional = true }
data-encoding = { version = "2", optional = true }

futures-util = { version = "0.3", optional = true, default-features = false, features = ["io"] }

[dev-dependencies]
ttlv = { path = ".", features = [
    "chrono",
    "xml",
    "text",
    "bitflags",
    "derive",
    "io-async",
] } # enables optional features for integration tests since default is empty
data-encoding = "2"
chrono = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
