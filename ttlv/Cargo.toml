[package]
name = "ttlv"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
#TODO: "binary" feature to toggle binary ttlv encoding/decoding
default = ["chrono", "derive", "xml", "text", "bitflags"]
chrono = ["dep:chrono"]
derive = ["dep:ttlv-derive"]
xml = ["dep:quick-xml", "dep:data-encoding", "chrono"]
text = ["chrono", "dep:data-encoding"]

arbitrary = ["dep:arbitrary"]
serde = ["dep:serde", "dep:serde_with", "dep:cfg_eval"]
bitflags = ["dep:bitflags"]

[dependencies]
ttlv-derive = { version = "*", path = "../ttlv-derive", optional = true }

task-local-extensions = "0.1"

thiserror = "2"
strum = "0.28"
strum_macros = "0.28"
chrono = { version = "0.4", optional = true }
bitflags = { version = "2", optional = true }

arbitrary = { version = "1", features = ["derive"], optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_with = { version = "3", optional = true, features = ["base64"] }
cfg_eval = { version = "0.1", optional = true }

quick-xml = { version = "0.39", optional = true }
data-encoding = { version = "2", optional = true }

[dev-dependencies]
data-encoding = "2"
chrono = "0.4"
