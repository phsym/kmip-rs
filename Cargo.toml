[workspace]
default-members = ["kmip", "ttlv", "ttlv-derive"]
resolver = "3"
members = ["kmip", "ttlv", "ttlv-derive", "pkcs11-kmip"]

[workspace.package]
readme = "README.md"
publish = false
repository = "https://github.com/phsym/kmip-rs"
rust-version = "1.88.0"
authors = ["Pierre-Henri Symoneaux"]
edition = "2024"
version = "0.5.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
debug = false
